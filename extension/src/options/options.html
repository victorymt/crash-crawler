<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider Usage Hub 设置</title>
  <link rel="stylesheet" href="./options.css">
</head>
<body>
  <main>
    <header class="app-header">
      <div>
        <div class="product-name">Provider Usage Hub</div>
        <h1>设置</h1>
      </div>
      <button id="save-global" class="primary">保存全局设置</button>
    </header>
    <section class="settings-section">
      <h2>后台刷新</h2>
      <div class="settings-grid">
        <label>
          自动刷新间隔
          <select id="auto-refresh-minutes">
            <option value="0">关闭</option>
            <option value="15">每 15 分钟</option>
            <option value="30" selected>每 30 分钟</option>
            <option value="60">每 1 小时</option>
            <option value="120">每 2 小时</option>
            <option value="360">每 6 小时</option>
          </select>
        </label>
        <label>
          后台页面策略
          <select id="auto-refresh-tab-policy">
            <option value="reuse-open-tabs" selected>仅复用已打开页面（推荐）</option>
            <option value="api-only">仅 API / HTTP</option>
            <option value="allow-hidden-tabs">允许创建后台标签页</option>
          </select>
        </label>
      </div>
      <p id="auto-refresh-meta" class="empty-state">默认每 30 分钟在后台刷新已启用的 provider，并更新工具栏角标。</p>
    </section>
    <section class="settings-section" aria-labelledby="local-sync-title">
      <h2 id="local-sync-title">本地 Web 同步</h2>
      <div class="settings-grid local-sync-grid">
        <label>
          Web 地址
          <input id="local-sync-url" type="url" spellcheck="false">
        </label>
        <label>
          配对令牌
          <input id="local-sync-token" type="password" autocomplete="off" spellcheck="false">
        </label>
        <label>
          同步方式
          <select id="local-sync-mode">
            <option value="merge">合并：保留另一侧其他 Provider</option>
            <option value="replace">替换：移除另一侧不存在的自定义 Provider</option>
          </select>
        </label>
      </div>
      <div class="source-actions">
        <button id="local-sync-pull" type="button">从 Web 拉取</button>
        <button id="local-sync-push" type="button" class="primary">推送到 Web</button>
        <button id="local-sync-rotate" type="button">打开 Web 配对页</button>
      </div>
      <p id="local-sync-meta" class="empty-state">令牌只保存在此浏览器的扩展存储中，不会写入 Provider 配置导出文件。</p>
    </section>
    <section class="provider-section">
      <div class="section-head">
        <h2>Providers</h2>
        <div class="section-actions">
          <button id="import-source" type="button">导入 Provider 配置</button>
          <button id="export-all-sources" type="button">导出全部</button>
          <button id="add-sub2api-provider" type="button">新增 AIHub/Sub2API</button>
          <button id="add-newapi-provider" type="button">新增 New API</button>
          <button id="add-page-provider" type="button" class="primary">新增来源</button>
        </div>
      </div>
      <div id="provider-bulk-actions" class="bulk-actions hidden" aria-live="polite">
        <strong id="selected-provider-count">已选择 0 个</strong>
        <label class="bulk-target">
          移动到
          <select id="bulk-provider-group"></select>
        </label>
        <button id="move-selected-providers" type="button" class="primary">移动</button>
        <button id="create-provider-group" type="button">新建分组</button>
        <button id="clear-provider-selection" type="button">取消选择</button>
      </div>
      <div id="providers"></div>
    </section>
    <section id="source-editor-section" class="hidden">
      <div class="section-head">
        <h2 id="editor-title">编辑来源</h2>
        <button id="close-editor" type="button">关闭</button>
      </div>
      <form id="source-form" novalidate>
        <div class="form-grid basic-fields">
          <label>
            名称
            <input id="source-name" required>
          </label>
          <label>
            ID
            <input id="source-id" required pattern="[a-zA-Z0-9._\-]+">
          </label>
          <label>
            分组
            <input id="source-group" list="provider-groups" maxlength="200" placeholder="未分组">
            <datalist id="provider-groups"></datalist>
          </label>
          <label>
            充值比例（1:N）
            <input id="source-recharge-ratio" type="number" min="0.01" max="1000" step="0.01" required>
          </label>
          <label class="checkbox-label enabled-field">
            <input id="source-enabled" type="checkbox">
            启用
          </label>
          <label class="checkbox-label enabled-field">
            <input id="source-refresh-on-visit" type="checkbox">
            访问页面时自动更新
          </label>
        </div>
        <input id="source-type" type="hidden" value="page">

        <div id="deepseek-credentials-block" class="editor-block credentials-block hidden">
          <div class="block-head">
            <h3>DeepSeek 凭据</h3>
          </div>
          <div class="credential-row">
            <label>
              API Key
              <input id="deepseek-key" type="password" autocomplete="off" placeholder="留空则保持当前密钥">
            </label>
            <button id="clear-deepseek-key" type="button">清除已保存密钥</button>
          </div>
        </div>

        <div class="editor-block">
          <div class="block-head">
            <h3>页面</h3>
            <button type="button" data-editor-action="add-page">添加页面</button>
          </div>
          <div class="page-row main-page-row">
            <label>
              页面名称
              <input value="主页" disabled>
            </label>
            <label>
              页面 URL
              <input id="source-target-url" type="url" required>
            </label>
          </div>
          <div id="secondary-pages"></div>
        </div>

        <p id="builtin-editor-note" class="empty-state hidden">内置来源使用固定解析器，可修改名称、主页 URL 和附加页面（例如 OpenCode workspace）。</p>

        <div id="metric-rules-block" class="editor-block">
          <div class="block-head">
            <h3>指标规则</h3>
            <div class="section-actions">
              <button type="button" data-editor-action="add-balance">余额</button>
              <button type="button" data-editor-action="add-quota">额度</button>
              <button type="button" data-editor-action="add-text">文本</button>
            </div>
          </div>
          <div id="metric-rules"></div>
        </div>

        <details id="advanced-block" class="advanced-block">
          <summary>高级设置</summary>
          <div class="form-grid advanced-fields">
            <label>
              登录页提示词
              <textarea id="source-login-hints" rows="3" spellcheck="false"></textarea>
            </label>
            <label>
              页面就绪选择器
              <input id="source-ready-selector" spellcheck="false">
            </label>
          </div>
        </details>

        <div class="editor-actions">
          <button type="button" data-editor-action="test">测试</button>
          <button type="submit" class="primary">保存来源</button>
          <button id="delete-source" type="button" class="danger">删除</button>
        </div>
      </form>
      <div id="test-preview" class="test-preview hidden" aria-live="polite"></div>
    </section>

    <section id="import-panel" class="hidden">
      <div class="section-head">
        <h2>导入 Provider 配置</h2>
        <button id="close-import" type="button">关闭</button>
      </div>
      <label>
        Provider 配置 JSON
        <textarea id="import-json" rows="8" spellcheck="false"></textarea>
      </label>
      <label>
        导入方式
        <select id="import-mode">
          <option value="merge">合并：更新同 ID，并保留其他 Provider</option>
          <option value="replace">替换：删除文件中不存在的自定义 Provider</option>
        </select>
      </label>
      <div class="source-actions">
        <input id="import-file" type="file" accept="application/json,.json" hidden>
        <button id="choose-import-file" type="button">选择文件</button>
        <button id="confirm-import" type="button" class="primary">导入</button>
      </div>
    </section>
    <div id="message" class="message" aria-live="polite"></div>
  </main>
  <script type="module" src="./options.js"></script>
</body>
</html>
