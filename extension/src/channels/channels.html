<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>渠道倍率 · Provider Usage Hub</title>
  <link rel="stylesheet" href="./channels.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div>
        <div class="product-name">Provider Usage Hub</div>
        <h1>渠道倍率</h1>
      </div>
      <div class="toolbar">
        <button id="refresh-channels" class="primary">刷新渠道</button>
        <button id="retry-channel-failed" hidden>重试失败</button>
        <button id="cancel-channel-refresh" class="danger" hidden>取消刷新</button>
        <button id="options">设置</button>
      </div>
      <div id="message" class="message" aria-live="polite"></div>
      <progress id="channel-refresh-progress" max="1" value="0" hidden></progress>
    </div>
  </header>

  <main class="page-shell">
    <section class="filters" aria-label="渠道筛选">
      <label class="model-filter">
        <span>模型</span>
        <select id="channel-model"></select>
      </label>
      <label class="filter-control">
        <span>状态</span>
        <select id="channel-status">
          <option value="">全部状态</option>
          <option value="operational">可用</option>
          <option value="degraded">降级</option>
          <option value="error">故障</option>
          <option value="unknown">未知</option>
        </select>
      </label>
      <label class="filter-control">
        <span>可用性</span>
        <select id="channel-availability">
          <option value="all">全部渠道</option>
          <option value="available">当前可用</option>
        </select>
      </label>
      <label class="filter-control">
        <span>倍率</span>
        <select id="channel-rate">
          <option value="all">全部倍率</option>
          <option value="known">仅已识别</option>
          <option value="unknown">仅未识别</option>
        </select>
      </label>
      <label class="filter-control">
        <span>Provider</span>
        <select id="channel-provider"><option value="">全部 Provider</option></select>
      </label>
      <div id="channel-meta" class="channel-meta"></div>
    </section>
    <section id="channel-provider-health" class="provider-health-band" aria-label="Provider 渠道状态" hidden></section>

    <section class="results" aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title">渠道列表</h2>
        <span id="updated-at"></span>
      </div>
      <div class="column-headings" aria-hidden="true">
        <span>排名</span>
        <span>Provider / 渠道</span>
        <span>监控状态</span>
        <span>倍率</span>
      </div>
      <div id="channel-results" class="channel-list"></div>
    </section>
  </main>

  <script type="module" src="./channels.js"></script>
</body>
</html>
