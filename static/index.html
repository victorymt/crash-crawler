<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Providers · Provider Usage Hub</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <span>Provider Usage Hub</span>
        <strong>Providers</strong>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a class="active" href="/">Providers</a>
        <a href="/channels">渠道</a>
        <a href="/settings">设置</a>
      </nav>
      <div class="toolbar">
        <button id="sync-auth" type="button">同步登录态</button>
        <button id="open-all" type="button">打开全部</button>
        <button id="refresh-all" type="button" class="primary">刷新全部</button>
      </div>
      <div class="operation-feedback">
        <div id="message" class="message" aria-live="polite"></div>
        <progress id="refresh-progress" class="refresh-progress" max="1" value="0" hidden></progress>
      </div>
    </div>
  </header>
  <main class="page-shell">
    <section class="summary-band" aria-label="Provider 摘要">
      <div><strong id="provider-count">0</strong><span>已启用</span></div>
      <div><strong id="healthy-count">0</strong><span>状态正常</span></div>
      <div><strong id="attention-count">0</strong><span>需要处理</span></div>
      <p id="refresh-meta">正在读取本地快照...</p>
    </section>
    <section id="provider-groups" class="provider-groups" aria-live="polite"></section>
  </main>
  <script src="/static/dashboard.js"></script>
</body>
</html>
