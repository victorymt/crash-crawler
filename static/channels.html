<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>渠道 · Provider Usage Hub</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <span>Provider Usage Hub</span>
        <strong>渠道</strong>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="/">Providers</a>
        <a class="active" href="/channels">渠道</a>
        <a href="/settings">设置</a>
      </nav>
      <div class="toolbar">
        <button id="refresh-channels" type="button" class="primary">刷新渠道</button>
        <button id="retry-channel-failed" type="button" hidden>重试失败</button>
        <button id="cancel-channel-refresh" type="button" class="danger" hidden>取消刷新</button>
      </div>
      <div class="operation-feedback">
        <div id="message" class="message" aria-live="polite"></div>
        <progress id="channel-refresh-progress" class="refresh-progress" max="1" value="0" hidden></progress>
      </div>
    </div>
  </header>
  <main class="page-shell">
    <section class="filters" aria-label="渠道筛选">
      <label class="model-filter">
        <span>模型</span>
        <select id="channel-model"><option value="">全部模型</option></select>
      </label>
      <label class="field">
        <span>状态</span>
        <select id="channel-status">
          <option value="">全部状态</option>
          <option value="operational">可用</option>
          <option value="degraded">降级</option>
          <option value="error">故障</option>
          <option value="unknown">未知</option>
        </select>
      </label>
      <label class="field">
        <span>可用性</span>
        <select id="channel-availability">
          <option value="all">全部渠道</option>
          <option value="available">当前可用</option>
        </select>
      </label>
      <label class="field">
        <span>倍率</span>
        <select id="channel-rate">
          <option value="all">全部倍率</option>
          <option value="known">仅已识别</option>
          <option value="unknown">仅未识别</option>
        </select>
      </label>
      <label class="field">
        <span>Provider</span>
        <select id="channel-provider"><option value="">全部 Provider</option></select>
      </label>
      <div id="channel-meta" class="channel-meta">正在读取渠道快照...</div>
    </section>
    <section class="results" aria-labelledby="results-title">
      <div class="results-head">
        <h1 id="results-title">渠道列表</h1>
        <span id="updated-at">--</span>
      </div>
      <div class="column-headings" aria-hidden="true">
        <span>排名</span><span>Provider / 渠道</span><span>监控状态</span><span>实际倍率</span>
      </div>
      <div id="channel-results" class="channel-list" aria-live="polite"></div>
    </section>
  </main>
  <script src="/static/config-events.js"></script>
  <script src="/static/api.js"></script>
  <script src="/static/channels.js"></script>
</body>
</html>
